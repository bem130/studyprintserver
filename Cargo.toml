[package]
name = "studyprintserver"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[dependencies]
anyhow = "1"
axum = "0.8"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }

[dev-dependencies]
ts-rs = "12.0.1"
